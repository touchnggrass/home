blueprint:
  name: IKEA Bilresa (Remote with scroll) - Light and Media Control
  description: |
    Control lights and a media player with the IKEA Bilresa (Remote with scroll) via Matter.
    
    **Features:**
    - Buttons 1-6 control two independent light groups
    - For each light group, left/right buttons dim up/down and the middle button toggles on/off
    - Short-press the middle button in either light group to cycle color temperature
    
    - Buttons 7-9 control one media player: button 7 raises volume, button 8 lowers volume, and button 9 short press toggles play/pause; long press toggles mute
    
    **Button Layout:**
    - Buttons 1-3: Group 1 light (dim up, dim down, toggle/color temperature)
    - Buttons 4-6: Group 2 light (dim up, dim down, toggle/color temperature)
    - Buttons 7-9: Media player (volume up, volume down, play/pause or mute)
    
    Assign the matching event entity to each Button 1-9 input. Find these under Developer Tools → States; they are named like "event.your_remote_name_button_1" through "button_9".

    Choose one light for each light group and one media player for Group 3. Brightness Step controls the light dimming increment. Transition Time sets the light fade duration, and the color temperature inputs set the warm, neutral, and cool Kelvin values.
    
  domain: automation
  
  input:
    button_1:
      name: Button 1
      selector:
        entity:
          filter:
            - domain: event
    button_2:
      name: Button 2
      selector:
        entity:
          filter:
            - domain: event
    button_3:
      name: Button 3
      selector:
        entity:
          filter:
            - domain: event
    button_4:
      name: Button 4
      selector:
        entity:
          filter:
            - domain: event
    button_5:
      name: Button 5
      selector:
        entity:
          filter:
            - domain: event
    button_6:
      name: Button 6
      selector:
        entity:
          filter:
            - domain: event
    button_7:
      name: Button 7
      selector:
        entity:
          filter:
            - domain: event
    button_8:
      name: Button 8
      selector:
        entity:
          filter:
            - domain: event
    button_9:
      name: Button 9
      selector:
        entity:
          filter:
            - domain: event
    
    group1_light:
      name: Group 1 Light (Buttons 1-3)
      description: Light(s) controlled by buttons 1-3
      selector:
        entity:
          filter:
            - domain: light
    
    group2_light:
      name: Group 2 Light (Buttons 4-6)
      description: Light(s) controlled by buttons 4-6
      selector:
        entity:
          filter:
            - domain: light
    
    group3_media_player:
      name: Group 3 Media Player (Buttons 7-9)
      description: Media player controlled by buttons 7-9
      selector:
        entity:
          filter:
            - domain: media_player
    
    percent_step:
      name: Percent Step
      description: Percentage to increase/decrease % per button press
      default: 5
      selector:
        number:
          min: 5
          max: 25
          step: 5
          unit_of_measurement: "%"

    transition_time:
      name: Transition Time
      description: Smooth transition duration for brightness changes
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: .1
          unit_of_measurement: "s"
    
    temp_warm:
      name: Warm Color Temperature
      description: Warm white color temperature in Kelvin
      default: 3000
      selector:
        number:
          min: 2000
          max: 3500
          step: 100
          unit_of_measurement: "K"
    
    temp_neutral:
      name: Neutral Color Temperature
      description: Neutral white color temperature in Kelvin
      default: 3500
      selector:
        number:
          min: 3500
          max: 5000
          step: 100
          unit_of_measurement: "K"
    
    temp_cool:
      name: Cool Color Temperature
      description: Cool white color temperature in Kelvin
      default: 5000
      selector:
        number:
          min: 5000
          max: 7000
          step: 100
          unit_of_measurement: "K"

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input button_1
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn1
  - platform: state
    entity_id: !input button_2
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn2
  - platform: state
    entity_id: !input button_3
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn3
  - platform: state
    entity_id: !input button_4
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn4
  - platform: state
    entity_id: !input button_5
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn5
  - platform: state
    entity_id: !input button_6
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn6
  - platform: state
    entity_id: !input button_7
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn7
  - platform: state
    entity_id: !input button_8
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn8
  - platform: state
    entity_id: !input button_9
    not_from:
      - unknown
      - unavailable
    not_to:
      - unknown
      - unavailable
    id: btn9

action:
  - variables:
      group1: !input group1_light
      group2: !input group2_light
      group3_media_player: !input group3_media_player
      warm_temp: !input temp_warm
      neutral_temp: !input temp_neutral
      cool_temp: !input temp_cool
      step_pct: !input percent_step
      trans_time: !input transition_time
      target_light: >
        {% if trigger.id in ['btn1', 'btn2', 'btn3'] %}
          {{ group1 }}
        {% else %}
          {{ group2 }}
        {% endif %}
      is_long: "{{ trigger.to_state.attributes.event_type == 'long_press' }}"
  
  # Ensure we only proceed if event_type is present (actual button event)
  - condition: template
    value_template: >
      {{ trigger.to_state.attributes.event_type is defined
         and trigger.to_state.attributes.event_type != none }}
  
  # Prevent stale events from triggering when device reconnects
  # Check both last_changed AND the actual event timestamp in the state
  - condition: template
    value_template: >
      {{ (now() - trigger.to_state.last_changed).total_seconds() < 5
         and (now() - (trigger.to_state.state | as_datetime | as_local)).total_seconds() < 5 }}
  
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'btn7' }}"
        sequence:
          - action: media_player.volume_up
            target:
              entity_id: "{{ group3_media_player }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'btn8' }}"
        sequence:
          - action: media_player.volume_down
            target:
              entity_id: "{{ group3_media_player }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'btn9' and not is_long }}"
        sequence:
          - action: media_player.media_play_pause
            target:
              entity_id: "{{ group3_media_player }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['btn3', 'btn6'] and not is_long }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ target_light }}"
            data:
              brightness: >
                {{ state_attr(target_light, 'brightness') | default(255) }}
              color_temp_kelvin: >
                {% set current = state_attr(target_light, 'color_temp_kelvin') | int(0) %}
                {% set mid_warm_neutral = (warm_temp + neutral_temp) / 2 %}
                {% set mid_neutral_cool = (neutral_temp + cool_temp) / 2 %}
                {% if current == 0 or current <= mid_warm_neutral %}
                  {{ neutral_temp }}
                {% elif current <= mid_neutral_cool %}
                  {{ cool_temp }}
                {% else %}
                  {{ warm_temp }}
                {% endif %}
              transition: "{{ trans_time }}"
      
      # Long press toggle (default behavior)
      - conditions:
          - condition: template
            value_template: "{{ is_long and trigger.id in ['btn3', 'btn6'] }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ target_light }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['btn1', 'btn4'] }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ target_light }}"
            data:
              brightness_step_pct: "{{ step_pct }}"
              transition: "{{ trans_time }}"
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['btn2', 'btn5'] }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ target_light }}"
            data:
              brightness_step_pct: "{{ 0 - step_pct }}"
              transition: "{{ trans_time }}"
